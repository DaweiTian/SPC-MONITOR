<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/fonts/orbitron.css" rel="stylesheet">
    <title>液奶过程监控系统</title>
    <style>
      #splash-overlay {
        position: fixed; inset: 0; z-index: 99999;
        background: #0a0e1a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash-overlay.hide { opacity: 0; pointer-events: none; }
      #splash-overlay .ring {
        width: 60px; height: 60px;
        border: 3px solid rgba(0,212,255,0.15);
        border-top-color: #00d4ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #splash-overlay .text { margin-top: 24px; font-size: 14px; color: #8b95a7; }
      #splash-overlay .sub { margin-top: 6px; font-size: 12px; color: #64748b; }
      #splash-overlay .error { margin-top: 12px; font-size: 13px; color: #ef4444; display: none; }
      #splash-overlay .bar-wrap {
        margin-top: 16px; width: 180px; height: 3px;
        background: rgba(0,212,255,0.1); border-radius: 2px;
        overflow: hidden;
      }
      #splash-overlay .bar {
        height: 100%; width: 30%;
        background: linear-gradient(90deg, #00d4ff, #0066ff);
        border-radius: 2px;
        animation: slide 1.5s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
    </style>
  </head>
  <body>
    <div id="splash-overlay">
      <div class="ring"></div>
      <div class="text" id="splash-text">正在启动后端服务</div>
      <div class="sub" id="splash-sub">首次启动可能需要几秒钟...</div>
      <div class="bar-wrap"><div class="bar"></div></div>
      <div class="error" id="splash-error"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        var retries = 0, maxRetries = 60;
        var isTauri = '__TAURI__' in window;
        var healthUrl = isTauri ? 'http://127.0.0.1:18080/api/health' : '/api/health';

        function showError(msg) {
          var err = document.getElementById('splash-error');
          if (err) { err.textContent = msg; err.style.display = 'block'; }
          var sub = document.getElementById('splash-sub');
          if (sub) sub.style.display = 'none';
          var bar = document.querySelector('.bar-wrap');
          if (bar) bar.style.display = 'none';
        }

        function hideSplash() {
          var el = document.getElementById('splash-overlay');
          if (el) { el.classList.add('hide'); setTimeout(function() { el.remove(); }, 500); }
        }

        function setText(msg) {
          var t = document.getElementById('splash-text');
          if (t) t.textContent = msg;
        }

        function checkBackend() {
          if (retries >= maxRetries) {
            showError('后端服务启动超时（' + Math.round(maxRetries * 1.5) + '秒），请检查后端日志');
            return;
          }
          retries++;

          // 阶段1：检查后端是否存活
          var ctrl = new AbortController();
          var timer = setTimeout(function() { ctrl.abort(); }, 5000);

          fetch(healthUrl, { signal: ctrl.signal })
            .then(function(r) {
              clearTimeout(timer);
              if (!r.ok) throw new Error('status ' + r.status);
              return r.json();
            })
            .then(function() {
              // 阶段2：验证客户端实际连接能力（再请求一次确认稳定）
              setText('正在验证连接...');
              var ctrl2 = new AbortController();
              var timer2 = setTimeout(function() { ctrl2.abort(); }, 5000);
              fetch(healthUrl, { signal: ctrl2.signal })
                .then(function(r2) {
                  clearTimeout(timer2);
                  if (r2.ok) {
                    hideSplash();
                  } else {
                    showError('后端已启动但连接不稳定 (HTTP ' + r2.status + ')，请检查网络或防火墙设置');
                  }
                })
                .catch(function(e2) {
                  clearTimeout(timer2);
                  showError('后端已启动但客户端无法连接: ' + (e2.name === 'AbortError' ? '请求超时' : e2.message) + '。请检查防火墙或端口 18080 是否被阻止');
                });
            })
            .catch(function(e) {
              clearTimeout(timer);
              // 还没启动完成，继续轮询
              setTimeout(checkBackend, 1500);
            });
        }
        checkBackend();
      })();
    </script>
  </body>
</html>
