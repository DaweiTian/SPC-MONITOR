<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/fonts/orbitron.css" rel="stylesheet">
    <title>液奶过程监控系统</title>
    <style>
      #splash-overlay {
        position: fixed; inset: 0; z-index: 99999;
        background: #0a0e1a;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        color: #e2e8f0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        transition: opacity 0.4s ease;
      }
      #splash-overlay.hide { opacity: 0; pointer-events: none; }
      #splash-overlay .ring {
        width: 60px; height: 60px;
        border: 3px solid rgba(0,212,255,0.15);
        border-top-color: #00d4ff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #splash-overlay .text { margin-top: 24px; font-size: 14px; color: #8b95a7; }
      #splash-overlay .sub { margin-top: 6px; font-size: 12px; color: #64748b; }
      #splash-overlay .error { margin-top: 12px; font-size: 13px; color: #ef4444; display: none; }
      #splash-overlay .bar-wrap {
        margin-top: 16px; width: 180px; height: 3px;
        background: rgba(0,212,255,0.1); border-radius: 2px;
        overflow: hidden;
      }
      #splash-overlay .bar {
        height: 100%; width: 30%;
        background: linear-gradient(90deg, #00d4ff, #0066ff);
        border-radius: 2px;
        animation: slide 1.5s ease-in-out infinite;
      }
      @keyframes slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }
    </style>
  </head>
  <body>
    <div id="splash-overlay">
      <div class="ring"></div>
      <div class="text">正在启动后端服务</div>
      <div class="sub">首次启动可能需要几秒钟...</div>
      <div class="bar-wrap"><div class="bar"></div></div>
      <div class="error" id="splash-error"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Poll backend health with timeout and max retries
      (function() {
        var retries = 0, maxRetries = 60;
        var isTauri = '__TAURI__' in window;
        function checkBackend() {
          if (retries >= maxRetries) {
            var err = document.getElementById('splash-error');
            if (err) { err.textContent = '后端服务启动超时，请检查日志'; err.style.display = 'block'; }
            var sub = document.querySelector('.sub');
            if (sub) sub.style.display = 'none';
            var bar = document.querySelector('.bar-wrap');
            if (bar) bar.style.display = 'none';
            return;
          }
          retries++;
          if (isTauri) {
            // Tauri: use native command to bypass CORS
            window.__TAURI__.core.invoke('check_backend_health').then(function(ok) {
              if (ok) {
                var el = document.getElementById('splash-overlay');
                if (el) { el.classList.add('hide'); setTimeout(function() { el.remove(); }, 500); }
              } else {
                setTimeout(checkBackend, 1500);
              }
            }).catch(function() { setTimeout(checkBackend, 1500); });
          } else {
            // Browser: use fetch
            var ctrl = new AbortController();
            var timer = setTimeout(function() { ctrl.abort(); }, 5000);
            fetch('http://127.0.0.1:18080/api/health', { signal: ctrl.signal })
              .then(function(r) { clearTimeout(timer); if (r.ok) return r.json(); throw new Error('not ok'); })
              .then(function() {
                var el = document.getElementById('splash-overlay');
                if (el) { el.classList.add('hide'); setTimeout(function() { el.remove(); }, 500); }
              })
              .catch(function() { clearTimeout(timer); setTimeout(checkBackend, 1500); });
          }
        }
        checkBackend();
      })();
    </script>
  </body>
</html>
