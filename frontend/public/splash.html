<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0e1a;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100vh; color: #e2e8f0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    overflow: hidden; user-select: none;
  }
  .ring {
    width: 80px; height: 80px;
    border: 3px solid rgba(0,212,255,0.15);
    border-top-color: #00d4ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .pulse {
    position: absolute;
    width: 80px; height: 80px;
    border: 2px solid rgba(0,212,255,0.3);
    border-radius: 50%;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 0.3; }
    50% { transform: scale(1.5); opacity: 0; }
  }
  .text { margin-top: 32px; font-size: 14px; color: #8b95a7; }
  .sub { margin-top: 8px; font-size: 12px; color: #8b95a7; }
  .bar-wrap {
    margin-top: 24px; width: 200px; height: 3px;
    background: rgba(0,212,255,0.1); border-radius: 2px;
  }
  .bar {
    height: 100%; width: 30%;
    background: linear-gradient(90deg, #00d4ff, #0066ff);
    border-radius: 2px;
    animation: slide 1.5s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(400%); }
  }
</style>
</head>
<body>
  <div class="pulse"></div>
  <div class="ring"></div>
  <div class="text">正在启动后端服务</div>
  <div class="sub">首次启动可能需要几秒钟...</div>
  <div class="bar-wrap"><div class="bar"></div></div>
  <script src="splash.js"></script>
</body>
</html>
