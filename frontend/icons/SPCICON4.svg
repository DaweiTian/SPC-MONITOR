<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#162447"/>
      <stop offset="100%" stop-color="#0c1829"/>
    </linearGradient>
    <radialGradient id="bgLight" cx="256" cy="220" r="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a5f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0c1829" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="dropFill" x1="256" y1="135" x2="256" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d6dfe9"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="195" y1="0" x2="330" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5a0"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dropShadow">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <clipPath id="iconClip"><rect width="512" height="512" rx="108"/></clipPath>
    <clipPath id="dropClip">
      <path d="M256 135 C256 135,170 240,170 290 C170 335,210 375,256 375 C302 375,342 335,342 290 C342 240,256 135,256 135Z"/>
    </clipPath>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#4a80b0" opacity="0.14"/>
    </pattern>
  </defs>

  <!-- ── 背景 ── -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect width="512" height="512" rx="108" fill="url(#bgLight)"/>
  <rect width="512" height="512" fill="url(#dots)" clip-path="url(#iconClip)"/>

  <!-- ── 仪表环 · 轨道 ── -->
  <circle cx="256" cy="265" r="142" fill="none" stroke="#1a3560" stroke-width="2" opacity="0.3"
          stroke-dasharray="3 7"/>
  <!-- ── 仪表环 · 进度弧 ── -->
  <circle cx="256" cy="265" r="142" fill="none" stroke="url(#lineGrad)" stroke-width="2.5"
          stroke-dasharray="490 893" stroke-dashoffset="-424" stroke-linecap="round" opacity="0.5"/>
  <!-- ── 仪表刻度线 ── -->
  <g stroke="#2a5580" stroke-width="1.5" stroke-linecap="round" opacity="0.3">
    <line x1="256" y1="120" x2="256" y2="131"/>
    <line x1="155" y1="164" x2="163" y2="172"/>
    <line x1="357" y1="164" x2="349" y2="172"/>
    <line x1="114" y1="265" x2="126" y2="265"/>
    <line x1="386" y1="265" x2="398" y2="265"/>
    <line x1="155" y1="366" x2="163" y2="358"/>
    <line x1="357" y1="366" x2="349" y2="358"/>
  </g>

  <!-- ── 乳滴 · 阴影 ── -->
  <g filter="url(#dropShadow)">
    <path d="M256 135 C256 135,170 240,170 290 C170 335,210 375,256 375
             C302 375,342 335,342 290 C342 240,256 135,256 135Z"
          fill="url(#dropFill)"/>
  </g>
  <!-- ── 乳滴 · 高光 ── -->
  <ellipse cx="232" cy="225" rx="20" ry="38" fill="#fff" opacity="0.3"
           transform="rotate(-12 232 225)"/>

  <!-- ── 乳滴内部数据 ── -->
  <g clip-path="url(#dropClip)">
    <!-- 水平参考线 -->
    <g stroke="#8aadd0" stroke-width="0.5" opacity="0.15">
      <line x1="175" y1="260" x2="337" y2="260"/>
      <line x1="175" y1="285" x2="337" y2="285"/>
      <line x1="175" y1="310" x2="337" y2="310"/>
      <line x1="175" y1="335" x2="337" y2="335"/>
      <line x1="175" y1="355" x2="337" y2="355"/>
    </g>
    <!-- 波形面积填充 -->
    <path d="M195,320 L210,315 L225,325 L240,305 L255,312 L270,298
             L285,305 L300,290 L315,295 L325,285 L325,365 L195,365Z"
          fill="url(#lineGrad)" opacity="0.07"/>
    <!-- 实时波形线 -->
    <polyline points="195,320 210,315 225,325 240,305 255,312 270,298 285,305 300,290 315,295 325,285"
              fill="none" stroke="url(#lineGrad)" stroke-width="3"
              stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- 数据节点 -->
    <circle cx="240" cy="305" r="3.5" fill="#00e5a0"/>
    <circle cx="270" cy="298" r="3.5" fill="#00d0b8"/>
    <circle cx="300" cy="290" r="3.5" fill="#00bcd8"/>
    <circle cx="325" cy="285" r="3.5" fill="#00b4d8"/>
    <!-- 最新数据点光晕 -->
    <circle cx="325" cy="285" r="10" fill="#00b4d8" opacity="0.15" filter="url(#glow)"/>
  </g>

  <!-- 乳滴描边 -->
  <path d="M256 135 C256 135,170 240,170 290 C170 335,210 375,256 375
           C302 375,342 335,342 290 C342 240,256 135,256 135Z"
        fill="none" stroke="#fff" stroke-width="1" opacity="0.08"/>

  <!-- ── 三指标指示灯 ── -->
  <!-- 脂肪 -->
  <circle cx="200" cy="432" r="12" fill="#FFD700" opacity="0.1"/>
  <circle cx="200" cy="432" r="6"  fill="#FFD700" opacity="0.85"/>
  <!-- 蛋白 -->
  <circle cx="256" cy="432" r="12" fill="#FF7F6E" opacity="0.1"/>
  <circle cx="256" cy="432" r="6"  fill="#FF7F6E" opacity="0.85"/>
  <!-- 全脂乳固体 -->
  <circle cx="312" cy="432" r="12" fill="#D0E0F0" opacity="0.1"/>
  <circle cx="312" cy="432" r="6"  fill="#D0E0F0" opacity="0.85"/>
</svg>