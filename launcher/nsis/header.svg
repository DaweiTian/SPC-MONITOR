<svg xmlns="http://www.w3.org/2000/svg" width="600" height="228" viewBox="0 0 600 228">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="45%" stop-color="#0c1528"/>
      <stop offset="100%" stop-color="#101a32"/>
    </linearGradient>
    <linearGradient id="accentH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="55%" stop-color="#3b9dff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="markStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7df0ff"/>
      <stop offset="100%" stop-color="#0090ff"/>
    </linearGradient>
    <linearGradient id="markFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="orb" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="600" height="228" fill="url(#bg)"/>
  <rect width="600" height="228" fill="url(#orb)"/>
  <g opacity="0.04" stroke="#00d4ff" stroke-width="1">
    <path d="M0 76H600M0 152H600"/>
    <path d="M150 0V228M300 0V228M450 0V228"/>
  </g>

  <rect x="0" y="0" width="600" height="5" fill="url(#accentH)"/>
  <rect x="0" y="223" width="600" height="5" fill="url(#accentH)" opacity="0.5"/>
  <rect x="1" y="1" width="598" height="226" fill="none" stroke="rgba(0,212,255,0.14)" stroke-width="2"/>

  <!-- brand mark: large & simple for 150x57 downscale -->
  <g transform="translate(52, 34)" filter="url(#soft)">
    <circle cx="80" cy="80" r="78" fill="rgba(0,212,255,0.07)"/>
    <path d="M80 8 C80 8 140 70 140 108 C140 138 112 158 80 158 C48 158 20 138 20 108 C20 70 80 8 80 8Z"
          fill="url(#markFill)" stroke="url(#markStroke)" stroke-width="5"/>
    <path d="M48 112 L68 92 L88 128 L108 78 L122 104"
          fill="none" stroke="#d9fbff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="215" y="108" font-family="Microsoft YaHei UI, Microsoft YaHei, PingFang SC, sans-serif"
        font-size="46" font-weight="700" fill="#f8fafc" letter-spacing="1">液奶过程监控系统</text>
  <text x="250" y="148" font-family="Segoe UI, Arial, sans-serif"
        font-size="18" font-weight="600" fill="#67e8f9" letter-spacing="2" opacity="0.9">SPC REAL-TIME ANALYSIS</text>
  <rect x="250" y="166" width="180" height="4" rx="2" fill="url(#accentH)" opacity="0.75"/>
</svg>
