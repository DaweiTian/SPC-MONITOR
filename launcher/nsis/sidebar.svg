<svg xmlns="http://www.w3.org/2000/svg" width="656" height="1256" viewBox="0 0 656 1256">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="40%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="40%" stop-color="#0b1426"/>
      <stop offset="100%" stop-color="#101a32"/>
    </linearGradient>
    <linearGradient id="stripe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="50%" stop-color="#3b9dff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="markStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8af3ff"/>
      <stop offset="100%" stop-color="#0090ff"/>
    </linearGradient>
    <linearGradient id="markFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0.04"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="28%" r="42%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0.2"/>
      <stop offset="55%" stop-color="#0066ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bottomGlow" cx="50%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="656" height="1256" fill="url(#bg)"/>
  <rect width="656" height="1256" fill="url(#halo)"/>
  <rect width="656" height="1256" fill="url(#bottomGlow)"/>

  <!-- grid -->
  <g opacity="0.04" stroke="#00d4ff" stroke-width="1">
    <path d="M0 160H656M0 320H656M0 480H656M0 640H656M0 800H656M0 960H656M0 1120H656"/>
    <path d="M164 0V1256M328 0V1256M492 0V1256"/>
  </g>

  <!-- right accent -->
  <rect x="648" y="0" width="8" height="1256" fill="url(#stripe)"/>
  <rect x="0" y="0" width="656" height="1256" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="2"/>

  <!-- brand mark -->
  <g transform="translate(328, 300)" filter="url(#soft)">
    <circle cx="0" cy="10" r="120" fill="rgba(0,212,255,0.05)"/>
    <circle cx="0" cy="10" r="92" fill="none" stroke="rgba(0,212,255,0.1)" stroke-width="1.5"/>
    <path d="M0 -110 C0 -110 72 -18 72 36 C72 78 40 106 0 106 C-40 106 -72 78 -72 36 C-72 -18 0 -110 0 -110Z"
          fill="url(#markFill)" stroke="url(#markStroke)" stroke-width="5"/>
    <path d="M0 -72 C0 -72 48 -12 48 28 C48 58 26 78 0 78 C-26 78 -48 58 -48 28 C-48 -12 0 -72 0 -72Z"
          fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.35"/>
    <path d="M-48 34 L-24 16 L0 52 L24 4 L48 28"
          fill="none" stroke="#b8f6ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-48" y1="0" x2="48" y2="0" stroke="#00d4ff" stroke-width="1.5" opacity="0.3" stroke-dasharray="6 4"/>
    <line x1="-48" y1="64" x2="48" y2="64" stroke="#00d4ff" stroke-width="1.5" opacity="0.22" stroke-dasharray="6 4"/>
  </g>

  <!-- titles -->
  <text x="328" y="500" font-family="Microsoft YaHei UI, Microsoft YaHei, PingFang SC, sans-serif"
        font-size="48" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="8">液奶过程</text>
  <text x="328" y="560" font-family="Microsoft YaHei UI, Microsoft YaHei, PingFang SC, sans-serif"
        font-size="48" font-weight="700" fill="#f8fafc" text-anchor="middle" letter-spacing="8">监控系统</text>
  <text x="328" y="604" font-family="Segoe UI, Arial, sans-serif"
        font-size="18" font-weight="500" fill="#67e8f9" text-anchor="middle" letter-spacing="5" opacity="0.8">SPC MONITOR</text>

  <line x1="218" y1="640" x2="438" y2="640" stroke="rgba(0,212,255,0.28)" stroke-width="1.5"/>
  <circle cx="328" cy="640" r="3.5" fill="#00d4ff" opacity="0.7"/>

  <!-- feature list -->
  <g font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif" font-size="22" fill="#94a3b8">
    <g transform="translate(0, 690)">
      <rect x="168" y="0" width="320" height="48" rx="12" fill="rgba(0,212,255,0.06)" stroke="rgba(0,212,255,0.14)"/>
      <circle cx="200" cy="24" r="5" fill="#00d4ff" opacity="0.75"/>
      <text x="328" y="32" text-anchor="middle">实时 SPC 控制分析</text>
    </g>
    <g transform="translate(0, 754)">
      <rect x="168" y="0" width="320" height="48" rx="12" fill="rgba(0,212,255,0.05)" stroke="rgba(0,212,255,0.12)"/>
      <circle cx="200" cy="24" r="5" fill="#00d4ff" opacity="0.55"/>
      <text x="328" y="32" text-anchor="middle">过程能力评估</text>
    </g>
    <g transform="translate(0, 818)">
      <rect x="168" y="0" width="320" height="48" rx="12" fill="rgba(0,212,255,0.04)" stroke="rgba(0,212,255,0.1)"/>
      <circle cx="200" cy="24" r="5" fill="#00d4ff" opacity="0.4"/>
      <text x="328" y="32" text-anchor="middle">智能预警管理</text>
    </g>
  </g>

  <!-- version badge -->
  <rect x="248" y="940" width="160" height="44" rx="22"
        fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.22)" stroke-width="1.5"/>
  <text x="328" y="969" font-family="Consolas, Courier New, monospace"
        font-size="22" fill="#67e8f9" text-anchor="middle" letter-spacing="2">v1.7.3</text>

  <!-- footer deco -->
  <g opacity="0.35">
    <circle cx="288" cy="1180" r="3" fill="#00d4ff"/>
    <circle cx="328" cy="1180" r="4" fill="#00d4ff" opacity="0.8"/>
    <circle cx="368" cy="1180" r="3" fill="#00d4ff"/>
  </g>
  <text x="328" y="1216" font-family="Microsoft YaHei UI, Microsoft YaHei, sans-serif"
        font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="2" opacity="0.55">POWERED BY YILI</text>
</svg>
