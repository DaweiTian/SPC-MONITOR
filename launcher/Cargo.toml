[package]
name = "ft1-monitor-launcher"
version = "1.5.1"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["system-tray", "shell-open", "dialog"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["blocking", "json"] }
anyhow = "1"
dirs = "5"
log = "0.4"
simplelog = "0.12"
