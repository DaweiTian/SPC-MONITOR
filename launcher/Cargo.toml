[package]
name = "SPC-Monitor"
version = "1.7.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon:系统托盘必需；devtools 在 Tauri v2 下会进 release 构建，生产包移除
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# blocking feature required for health_check() in service.rs (synchronous HTTP)
reqwest = { version = "0.12", features = ["blocking", "json"] }
dirs = "5"
log = "0.4"
simplelog = "0.12"
# 日志完整时间戳与本地时区（simplelog 依赖 time 0.3）
time = { version = "0.3", features = ["local-offset", "formatting", "parsing", "macros"] }
open = "5"
tokio = { version = "1", features = ["time"] }
# 增量热更新：校验 patch 哈希并解压
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
hex = "0.4"

[target.'cfg(target_os = "windows")'.dependencies]
window-vibrancy = "0.6"
