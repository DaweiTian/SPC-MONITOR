[package]
name = "ft1-monitor-launcher"
version = "1.0.0"
edition = "2021"

[dependencies]
tauri = { version = "1.5", features = ["system-tray", "shell-open"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", features = ["json"] }
anyhow = "1"
