server {
    listen 9090;
    server_name _;

    # 更新文件存放目录
    root /var/www/spc-monitor-updates;
    index index.html;

    # 允许跨域（Tauri updater 需要）
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";

    # latest.json 缓存策略：不缓存，每次都获取最新
    location = /latest.json {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        default_type application/json;
        charset utf-8;
    }

    # 更新包文件缓存策略：长期缓存（文件名含版本号，更新时是新文件）
    # 实际产物为 Tauri NSIS *-setup.exe / *-setup.exe.sig
    location ~* \.(nsis\.zip|nsis\.zip\.sig|exe|exe\.sig)$ {
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Cache-Control "public, max-age=604800";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 日志
    access_log /var/log/nginx/spc-monitor-updates-access.log;
    error_log /var/log/nginx/spc-monitor-updates-error.log;
}
